[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huetracer"
version = "0.0.15"
description = "Analyze cell-cell interaction with spatial transcriptome data."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Masachika Ikegami", email = "ikegamitky@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["spatial transcriptomics", "cell-cell interaction", "single-cell", "bioinformatics"]
dependencies = [
    "setuptools",
    "numpy==1.26.4",
    "matplotlib",
    "scipy==1.15.3",
    "tqdm",
    "scanpy",
    "scvi-tools==1.3.3",
    "bin2cell",
    "stardist",
    "csbdeep",
    "seaborn",
    "adjustText",
    "gdown",
    "plotly",
    "scikit-image",
    "scikit-learn",
    "opencv-python",
    "pandas",
    "zarr",
    "imagecodecs",
    "tifffile",
    "jupyterlab",
    "ipywidgets",
    "ipympl",
    "jupyterlab-widgets",
    "streamlit",
    "igraph",
    "leidenalg",
    "datatable",
    "infercnvpy",
    "openai",
]

[project.urls]
Homepage = "https://github.com/MANO-B/HueTracer"
Repository = "https://github.com/MANO-B/HueTracer"
Issues = "https://github.com/MANO-B/HueTracer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tutorial*"]

[project.optional-dependencies]
gpu = [
    "tensorflow==2.20.0",
    "torch>=2.0",
    "torchvision",
    "torchaudio",
    "cupy-cuda12x",
    "cudf-cu12==26.2.*",
    "dask-cudf-cu12==26.2.*",
    "cuml-cu12==26.2.*",
    "cugraph-cu12==26.2.*",
]

cpu = [
    "tensorflow-cpu==2.20.0",
    "torch",
    "torchvision",
    "torchaudio",
]
